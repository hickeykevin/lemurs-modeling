_target_: src.models.health_module.FLAMLHealthModule
auto_class_weights: false
class_weights: null
automl_config:
  time_budget: 30 # total time in seconds
  metric: 'f1'
  estimator_list: ['svm_pipeline'] # Scaled Support Vector Machine pipeline (StandardScaler + SVC)
  n_jobs: 1
  log_file_name: ${paths.output_dir}/flaml.log
task: 'classification'
