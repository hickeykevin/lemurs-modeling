# Requires the `tirex` extra (`uv sync --extra tirex`). NX-AI's TiRex (xLSTM, 35M) as a frozen
# feature extractor with a linear head; runs on CPU or GPU. See src/models/components/tirex_net.py.
defaults:
  - net: tirex
  - optimizer: adam
  - scheduler: null

_target_: src.models.health_module.HealthLitModule
compile: false
auto_class_weights: true # inverse-frequency CE weights from each fold's training split
class_weights: null
use_sequence_data: true
