# Featurizer config for tabular tree models (FLAML/XGBoost/etc.).
# Collapses each modality's time-series window into summary statistics
# instead of feeding raw per-bin values.
_target_: src.data.components.tabular_features.SummaryStatsFeaturizer

# Which statistics to compute, and the order they appear in each modality's block.
stats: [mean, median, std, min, max]



# Trailing columns to drop before computing stats (e.g. a sampler's
# appended sin/cos time-of-day columns, which aren't modality signal).
# Setting to 'auto' automatically detects time features:
#   exclude_last_n_cols = total_feature_cols - len(datamodule.modalities)
# (e.g. 4 for RollingSampler, 2 for OffsetSampler, 0 if include_time_features=false).
# Can also be explicitly overridden with an integer (e.g. 0, 2, 4).
exclude_last_n_cols: auto
