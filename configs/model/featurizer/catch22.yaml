# Featurizer config for tabular tree models (FLAML/XGBoost/etc.).
# Collapses each modality's time-series window into the 22 catch22
# time-series features instead of feeding raw per-bin values or the
# simpler 5-stat summary.
_target_: src.data.components.catch22_features.Catch22Featurizer

# Value substituted for a catch22 output that's undefined (NaN/inf) on a
# given window -- e.g. most features on an all-zero or constant window.
fill_value: 0.0

# Setting to 'auto' automatically detects time features:
#   exclude_last_n_cols = total_feature_cols - len(datamodule.modalities)
# (e.g. 4 for RollingSampler, 2 for OffsetSampler, 0 if include_time_features=false).
# Can also be explicitly overridden with an integer (e.g. 0, 2, 4).
exclude_last_n_cols: auto

# Channel selection mode for multi-channel / DualScaler inputs:
# - 'all': compute catch22 over all channels (both global and subject scaled) -> 44 feats/modality
# - 'global': compute catch22 only over global-scaled channels (drops duplicate subject channels) -> 22 feats/modality
# - 'subject': compute catch22 only over subject-scaled channels -> 22 feats/modality
channel_mode: global

# Number of sensor modalities. If null, auto-detected from datamodule.modalities in FLAMLHealthModule.
num_modalities: null

