# Featurizer config for tabular tree models (FLAML): frozen TiRex (NX-AI, xLSTM) embedding of
# each modality's window, plus the same summary statistics as summary_stats.yaml, so a
# comparison with the summary_stats runs isolates what the embedding adds.
# Needs the `tirex` extra (`uv sync --extra tirex`); uses the GPU when one is available.
_target_: src.data.components.tirex_features.TiRexFeaturizer
layer_pooling: mean            # mean (512 dims per modality) | all (12 blocks, 6,144) | last
append_summary_stats: true
stats: [mean, median, std, min, max]
exclude_last_n_cols: auto      # resolved by FLAMLHealthModule from the sampler's time features
num_modalities: null           # resolved by FLAMLHealthModule from datamodule.modalities
device: auto
batch_size: 512
checkpoint_repo_id: NX-AI/TiRex
