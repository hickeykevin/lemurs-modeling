# Requires the `chronos2` extra (`uv sync --extra chronos2`). Unlike model=wbm, this
# runs on CPU (slowly) as well as GPU -- see src/models/components/chronos2_net.py.
defaults:
  - net: chronos2
  - optimizer: adam
  - scheduler: null

_target_: src.models.health_module.HealthLitModule
compile: false
auto_class_weights: false
class_weights: null
use_sequence_data: true
