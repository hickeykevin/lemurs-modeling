defaults:
  - net: lstm
  - optimizer: adam
  - scheduler: null

_target_: src.models.health_module.HealthLitModule
compile: false
auto_class_weights: true # compute inverse-frequency CE weights from the training split (per-fold under CV); ignored if class_weights is set explicitly
class_weights: null # optional explicit weights per class (e.g. [1.0, 5.0]); overrides auto_class_weights if set
use_sequence_data: true # this should be set to true unless ablating 

