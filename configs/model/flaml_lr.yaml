_target_: src.models.health_module.FLAMLHealthModule
auto_class_weights: false
class_weights: null
automl_config:
  time_budget: 30 # total time in seconds
  metric: 'f1'
  estimator_list: ['lrl1', 'lrl2'] # Logistic Regression (L1 & L2 regularization)
  n_jobs: 1
  log_file_name: ${paths.output_dir}/flaml.log
task: 'classification'
