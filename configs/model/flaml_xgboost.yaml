
defaults:
  - featurizer: null
  - _self_


_target_: src.models.health_module.FLAMLHealthModule
auto_class_weights: false
class_weights: null
automl_config:
  time_budget: 30 # total time in seconds
  metric: 'f1'
  estimator_list: ['xgboost'] # pinned, unlike flaml.yaml's multi-estimator search
  n_jobs: 1
  log_file_name: ${paths.output_dir}/flaml.log
task: 'classification'
use_sequence_features: true # false = fit on the static vector only (no sensors)
within_person_centering: none  # past_mean: minus the user's mean over earlier surveys; past_z: also divided by their SD
