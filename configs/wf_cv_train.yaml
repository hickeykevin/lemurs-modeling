# @package _global_

# specify here default configuration
# order of defaults determines the order in which configs override each other
defaults:
  - _self_
  - data: walk_forward
  - model: default
  - callbacks: walk_forward
  - logger: csv # set logger here or use command line (e.g. `python wf_cv_train.py logger=tensorboard`)
  - trainer: cpu
  - paths: default
  - extras: default
  - hydra: default

  # experiment configs allow for version control of specific hyperparameters
  # e.g. best hyperparameters for given model and datamodule
  - experiment: null

  # config for hyperparameter optimization
  - hparams_search: null

  # optional local config for machine/user specific settings
  # it's optional since it doesn't need to exist and is excluded from version control
  - optional local: default

  # debugging config (enable through command line, e.g. `python wf_cv_train.py debug=default)
  - debug: null

# task name, determines output directory path
task_name: "wf_cv_train"

# tags to help you identify your experiments
# you can overwrite this in experiment configs
# overwrite from command line with `python wf_cv_train.py tags="[first_tag, second_tag]"`
tags: ["walk_forward", "dev"]

# set False to skip model training (test-only run against a fixed checkpoint
# is not really meaningful across folds here, since each fold trains its own
# model -- this mainly exists for debug=fdr-style fast dev runs)
train: True

# testing is NOT gated behind a flag here (unlike cv_train.py's `test`): see
# wf_cv_train.py's comment at its trainer.test() call -- pooled test
# predictions are this script's entire purpose, not an optional extra.

# seed for random number generators in pytorch, numpy and python.random.
seed: 7
