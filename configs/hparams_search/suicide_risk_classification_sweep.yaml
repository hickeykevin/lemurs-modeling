# W&B Sweep Configuration for Suicide Risk Classification
name: suicide_risk_classification_sweep
project: lemurs-modeling
method: bayes
metric:
  name: val/f1
  goal: maximize

parameters:
  data/scaler:
    values: [standard, subject_standard, none]
  data/sampler:
    values: [block, offset]
  ++data.sampler.resample_freq:
    values: [4h, 6h, 12h]
  data.collapse_strategy:
    values: [mean, max, last]
  ++data.sampler.lookback_days:
    distribution: int_uniform
    min: 3
    max: 7
  ++data.sampler.start_offset_hours:
    values: [-72, -96, -120, -144, -168]
  model.net.hidden_size:
    values: [32, 64, 128]
  model.net.num_layers:
    values: [1, 2, 3]
  model.optimizer.lr:
    distribution: log_uniform_values
    min: 0.0001
    max: 0.01
  model.user_id_dropout:
    distribution: uniform
    min: 0.0
    max: 0.3
  ++model.net.dropout:
    distribution: uniform
    min: 0.0
    max: 0.5
  data.os_filter:
    values: [ios, both]

command:
  - python
  - src/train.py
  - "data/aggregator=suicide_risk"
  - "model=default"
  - "data.modalities=[step]"
  - "data/preprocessors=[step]"
  - "trainer.max_epochs=100"
  - "callbacks=[classification_metrics,confusion_matrix,target_distribution]"
  - "logger.wandb.group=suicide_risk_classification_sweep"
  - "logger=[csv,wandb]"
  - ${args_no_hyphens}
