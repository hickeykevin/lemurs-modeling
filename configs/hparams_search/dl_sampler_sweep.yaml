# W&B Sweep Configuration: Rolling Sampler x Deep Learning Model x Modality Sweep
#
# Grid search (method: grid) -- exhaustive, not sampled. Every combination of
# every parameter below runs exactly once (20 x 3 x 7 = 420 runs).
#
# Three swept axes, crossed:
#   sampler_pkg -- rolling_<lookback>h_<window>h (20 configs):
#     lookback in [24, 48, 72, 96, 120], window (resample_freq) in [4, 6, 8, 12].
#     Every value here is a self-contained config in configs/data/sampler/sweep_configs/.
#   model_pkg -- 3 Deep Learning / Foundation models (3 configs):
#     - transformer (SimpleTransformer)
#     - lstm (SimpleLSTM)
#     - chronos_bolt (Amazon Chronos-Bolt Mini)
#   modalities_choice -- all 7 non-empty subsets of {step, calorie, distance} (7 configs):
#     Configured via the data/modalities config group (e.g. data/modalities=step_distance).
#
# Fixed, not swept (see command: below): scaler=dual; os_filter=both;
# collapse_strategy=none; use_demographics=true; use_sleep=false;
# use_survey_context=false; require_sensor_data=true; purge_hours=120.0 (5 days).
#
# scaler=dual, require_sensor_data=true, and purge_hours=120.0 DIFFER from
# defaults and are overridden here. purge_hours=120.0 pins the boundary purge
# duration to the maximum lookback across all runs (5 days) so that all lookback
# configurations train on the exact same dataset splits without sample count variance.
# The other four already match default.yaml's values -- pinned explicitly anyway
# so the sweep states its own assumptions rather than depending on defaults.

name: dl_sampler_sweep
project: lemurs-modeling
program: src/train.py
method: grid
metric:
  name: pooled/f1
  goal: maximize

parameters:
  sampler_pkg:
    values:
      - rolling_24h_4h
      - rolling_24h_6h
      - rolling_24h_8h
      - rolling_24h_12h
      - rolling_48h_4h
      - rolling_48h_6h
      - rolling_48h_8h
      - rolling_48h_12h
      - rolling_72h_4h
      - rolling_72h_6h
      - rolling_72h_8h
      - rolling_72h_12h
      - rolling_96h_4h
      - rolling_96h_6h
      - rolling_96h_8h
      - rolling_96h_12h
      - rolling_120h_4h
      - rolling_120h_6h
      - rolling_120h_8h
      - rolling_120h_12h

  model_pkg:
    values:
      - transformer
      - lstm
      - chronos_bolt

  modalities_choice:
    values:
      - step
      - calorie
      - distance
      - step_calorie
      - step_distance
      - calorie_distance
      - step_calorie_distance

command:
  - bash
  - scripts/sampler_model_sweep_wrapper.sh
  - ${args_no_hyphens}
