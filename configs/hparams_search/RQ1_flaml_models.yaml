# W&B Sweep Configuration: RQ1 FLAML Models x Rolling Sampler x Modality Sweep
#
# Grid search (method: grid) -- exhaustive evaluation across:
#   20 rolling samplers x 4 FLAML AutoML models x 7 sensor modalities = 560 runs.
#
# Research Question 1 (RQ1) Objective:
#   Evaluate unimodal, bimodal, and trimodal sensor synergy across 4 FLAML model families
#   (XGBoost, Random Forest, Logistic Regression, SVM) optimized for AUC score (ROC AUC),
#   with hours slept as the sole non-sensor auxiliary feature and dual scaling.
#
# Three swept axes:
#   sampler_pkg (20 configs):
#     lookback in [24, 48, 72, 96, 120] hours, resample_freq in [4, 6, 8, 12] hours.
#   model_pkg (4 configs):
#     - flaml_xgboost (XGBoost)
#     - flaml_rf (Random Forest)
#     - flaml_lr (Logistic Regression L1 & L2)
#     - flaml_svm (Scaled Support Vector Machine: StandardScaler + SVC)
#   modalities_choice (7 configs):
#     - step, calorie, distance, step_calorie, step_distance, calorie_distance, step_calorie_distance
#
# Fixed Settings & Experimental Conditions:
#   - Model Optimization Metric: model.automl_config.metric=roc_auc (optimizes FLAML for AUC)
#   - Class Imbalance Handling: model.auto_class_weights=true (weights loss by inverse class frequencies)
#   - Auxiliary Features: hours slept only (data.use_sleep=true, data.sleep_feature_mode=hours_only)
#   - Excluded Non-Sensor Features: data.use_demographics=false, data.use_survey_context=false, data.use_device_source=false
#   - Normalization: data/scaler=dual
#   - Evaluation Plan: eval_plan=cyclical (walk-forward cyclical cross-validation)
#   - Split Purge: data.purge_hours=120.0 (pins boundary purge to max lookback of 5 days)
#   - Quality Filters: data.os_filter=both, data.collapse_strategy=none, data.require_sensor_data=true

name: RQ1_flaml_models
project: lemurs-modeling
program: src/train.py
method: grid
metric:
  name: pooled/auroc
  goal: maximize

parameters:
  sampler_pkg:
    values:
      - rolling_24h_4h
      - rolling_24h_6h
      - rolling_24h_8h
      - rolling_24h_12h
      - rolling_48h_4h
      - rolling_48h_6h
      - rolling_48h_8h
      - rolling_48h_12h
      - rolling_72h_4h
      - rolling_72h_6h
      - rolling_72h_8h
      - rolling_72h_12h
      - rolling_96h_4h
      - rolling_96h_6h
      - rolling_96h_8h
      - rolling_96h_12h
      - rolling_120h_4h
      - rolling_120h_6h
      - rolling_120h_8h
      - rolling_120h_12h

  model_pkg:
    values:
      - flaml_xgboost   # XGBoost
      - flaml_rf        # Random Forest
      - flaml_lr        # Logistic Regression (L1 & L2)
      - flaml_svm       # Support Vector Machine (StandardScaler + SVC)

  modalities_choice:
    values:
      - step
      - calorie
      - distance
      - step_calorie
      - step_distance
      - calorie_distance
      - step_calorie_distance

command:
  - bash
  - scripts/RQ1_flaml_models.sh
  - uv
  - run
  - python
  - src/train.py
  - eval_plan=cyclical
  - task_name=cyclical_sweep
  - logger=wandb
  - data/scaler=dual
  - data.os_filter=both
  - data.collapse_strategy=none
  - data.use_demographics=false
  - data.use_sleep=true
  - data.sleep_feature_mode=hours_only
  - data.use_survey_context=false
  - data.require_sensor_data=true
  - data.purge_hours=120.0
  - trainer.max_epochs=75
  - trainer.enable_checkpointing=false
  - callbacks.model_checkpoint=null
  - callbacks.early_stopping=null
  - model.automl_config.metric=roc_auc
  - model.auto_class_weights=true
  - ${args_no_hyphens}
