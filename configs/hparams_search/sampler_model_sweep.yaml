# W&B Sweep Configuration: Sampler x Model Sweep
#
# Two axes, crossed:
#   sampler_pkg -- rolling_<lookback>h_<window>h and offset_<lookback>h_<window>h,
#     lookback in [24, 48, 72, 96, 120], window (resample_freq) in [4, 6, 8, 12].
#     Every value here is a self-contained config in
#     configs/data/sampler/sweep_configs/ -- picking one is a plain Hydra
#     group override (data/sampler=<name>), so there is no risk of a class
#     getting an argument it doesn't accept.
#   model_pkg -- default (LSTM), transformer, flaml_xgboost (FLAML AutoML
#     pinned to estimator_list=[xgboost], not FLAML's usual multi-estimator
#     search -- see configs/model/flaml_xgboost.yaml). Each is likewise a
#     self-contained config; no cross-model arg is set from this file, since
#     e.g. automl_config only exists on FLAMLHealthModule and would error
#     under default/transformer.

name: sampler_model_sweep
project: lemurs-modeling
program: src/train.py
method: bayes
metric:
  name: val/f1_best
  goal: maximize

parameters:
  sampler_pkg:
    values:
      - rolling_24h_4h
      - rolling_24h_6h
      - rolling_24h_8h
      - rolling_24h_12h
      - rolling_48h_4h
      - rolling_48h_6h
      - rolling_48h_8h
      - rolling_48h_12h
      - rolling_72h_4h
      - rolling_72h_6h
      - rolling_72h_8h
      - rolling_72h_12h
      - rolling_96h_4h
      - rolling_96h_6h
      - rolling_96h_8h
      - rolling_96h_12h
      - rolling_120h_4h
      - rolling_120h_6h
      - rolling_120h_8h
      - rolling_120h_12h
      - offset_24h_4h
      - offset_24h_6h
      - offset_24h_8h
      - offset_24h_12h
      - offset_48h_4h
      - offset_48h_6h
      - offset_48h_8h
      - offset_48h_12h
      - offset_72h_4h
      - offset_72h_6h
      - offset_72h_8h
      - offset_72h_12h
      - offset_96h_4h
      - offset_96h_6h
      - offset_96h_8h
      - offset_96h_12h
      - offset_120h_4h
      - offset_120h_6h
      - offset_120h_8h
      - offset_120h_12h

  model_pkg:
    values:
      - default        # LSTM
      - transformer
      - flaml_xgboost   # FLAML AutoML, pinned to XGBoost

command:
  - ${env}
  - python
  - ${program}
  - "data/sampler=sweep_configs/${sampler_pkg}"
  - "model=${model_pkg}"
