# @package _global_

# Defaults are the paper's fixed protocol (cyclical walk-forward CV, step + distance, dual
# scaler, hours slept, 120 h purge, pinned database rows). A run picks a model, optionally a
# featurizer, and a sampler; see README.md.
defaults:
  - _self_
  - data: walk_forward_cyclic
  - model: flaml_xgboost
  - callbacks: walk_forward
  - eval_plan: cyclical
  - logger: csv # logger=wandb to log to Weights & Biases
  - trainer: cpu
  - paths: default
  - extras: default
  - hydra: default

  # optional local config for machine/user specific settings
  # it's optional since it doesn't need to exist and is excluded from version control
  - optional local: default

# task name, determines output directory path
task_name: "rq2"

# tags to help you identify your experiments
tags: ["rq2"]

# set False to skip model training
train: True

# evaluate on test set, using best model weights achieved during training
test: False

# simply provide checkpoint path to resume training
ckpt_path: null

# seed for random number generators in pytorch, numpy and python.random
seed: 7
