# @package _global_

# to execute this experiment run:
# python train.py experiment=flaml_health

defaults:
  - override /data: default
  - override /data/preprocessors: [step]
  - override /model: flaml
  - override /callbacks: [classification_metrics,confusion_matrix]
  - override /trainer: cpu
  - override /logger: csv

tags: ["health", "flaml"]

seed: 42

trainer:
  min_epochs: 1
  max_epochs: 1

callbacks:
  confusion_matrix:
    frequency: 1

data:
  os_filter: both
  collapse_strategy: mean  
  modalities: ["step"]
