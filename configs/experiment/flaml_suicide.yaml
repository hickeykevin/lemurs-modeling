# @package _global_

# to execute this experiment run:
# python train.py experiment=flaml_suicide

defaults:
  - override /data: health
  - override /model: flaml
  - override /callbacks: default
  - override /trainer: default

tags: ["health", "flaml", "suicide_risk"]

seed: 12345

trainer:
  min_epochs: 1
  max_epochs: 1
  accelerator: cpu
  devices: 1

data:
  batch_size: 8
