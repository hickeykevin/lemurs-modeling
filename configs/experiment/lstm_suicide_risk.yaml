# @package _global_

# to execute this experiment run:
# python src/train.py experiment=lstm_suicide_risk

defaults:
  - override /data: health
  - override /model: health
  - override /model/net: lstm
  - override /callbacks: [confusion_matrix,classification_metrics]
  - override /data/aggregator: suicide_risk
  - override /data/scaler: standard
  - override /data/sampler: block
  - override /trainer: cpu

tags: ["health", "lstm", "suicide_risk"]

seed: 42

model:
  net:
    input_size: ${len:${data.modalities}}
    output_size: 2

data:
  os_filter: ios
  modalities: ['step', 'calorie']
  split_mode: longitudinal
  num_workers: 2

trainer:
  gradient_clip_val: 1.0

