# @package _global_

# Per-user walk-forward CV, expanding window. See eval_schemes.md.
# callbacks=walk_forward relaxes early_stopping.strict, since a fold's val
# split can end up empty after purging.
defaults:
  - override /callbacks: walk_forward
  - override /data: walk_forward_expanding

eval_plan:
  _target_: src.eval_plans.walk_forward.WalkForwardPlan
  n_bootstraps: 1000 # BCa bootstrap resamples per pooled metric
