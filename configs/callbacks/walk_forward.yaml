defaults:
  - model_summary
  - tqdm_progress_bar
  - classification_metrics
  - within_person_auroc
  - confusion_matrix
  - _self_

# No checkpointing or early stopping: cyclical folds have no validation window, so every
# fold trains for the full trainer.max_epochs and is evaluated on its final weights.

model_summary:
  max_depth: -1
