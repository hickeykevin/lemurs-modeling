defaults:
  - model_checkpoint
  - early_stopping
  - model_summary
  - tqdm_progress_bar
  - classification_metrics
  - within_person_auroc
  - pooled_metrics
  - _self_

# Same base callbacks as configs/callbacks/default.yaml, plus pooled_metrics:
# for use with train.py against a datamodule whose data_val/data_test are
# built with return_index=True (IndexedHealthDataModule,
# WalkForwardHealthDataModule) -- e.g. `python train.py data=
# single_split callbacks=pooled_eval`. Gets the same pooled,
# user-cluster BCa bootstrap CI reported for walk-forward CV schemes,
# instead of ClassificationMetricsCallback's row-level BootStrapper CI. See
# PooledMetricsCallback's docstring and docs/eval_schemes.md.


model_checkpoint:
  dirpath: ${paths.output_dir}/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: "val/auroc"
  mode: "max"
  save_last: True
  auto_insert_metric_name: False

early_stopping:
  monitor: "val/auroc"
  patience: 100
  mode: "max"

model_summary:
  max_depth: -1
