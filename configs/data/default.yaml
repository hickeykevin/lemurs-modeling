defaults:
  - _self_
  - aggregator: suicide_risk
  - sampler: rolling
  - scaler: robust
  - preprocessors: [step, calorie]

_target_: src.data.health_datamodule.HealthDataModule
modalities: ["step", "calorie"]

batch_size: 16
train_val_test_split: [0.7, 0.15, 0.15]
num_workers: 1
pin_memory: False
random_state: ${seed}
split_mode: longitudinal # user = disjoint participants; longitudinal = per-user temporal split
purge_hours: null # gap (hours) purged at each split boundary; null derives it from the sampler's lookback
os_filter: both # both, ios, android
collapse_strategy: none # mean, max, min, first, last, none -- none keeps one sample per survey response
require_sensor_data: false # drop responses with no sensor data in their sampling window

use_survey_context: false # which daily survey (morning/afternoon) a response is, and its referent period
include_time_features: true
use_demographics: true
use_sleep: false

exclude_user_ids: null # null uses CohortBuilder.DEFAULT_EXCLUDED_USER_IDS
