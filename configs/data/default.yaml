defaults:
  - _self_
  - aggregator: suicide_risk
  - sampler: rolling
  - scaler: robust
  - preprocessors: [step, calorie]

_target_: src.data.health_datamodule.HealthDataModule
modalities: ["step", "calorie"]

batch_size: 16
train_val_test_split: [0.7, 0.15, 0.15]
num_workers: 1
pin_memory: False
random_state: ${seed}
# user = disjoint participants (matches deployment: new users have no labels).
# longitudinal = temporal split within each user; diagnostic only.
# Row-level random splitting was removed: it leaks users across the split and
# measures user identification rather than risk. See CohortSplitter.
split_mode: longitudinal # user, longitudinal
# Longitudinal mode only: gap (hours) purged around each train/val and val/test
# boundary so a retained sample's sampler window can't reach across the boundary
# into data used on the other side of it. null derives it from the sampler's own
# lookback (data/sampler's window_bounds span) automatically; set explicitly to
# hold purge width fixed across a sweep over multiple sampler configs.
purge_hours: null
# Two longitudinal-mode purge diagnostics -- swap_val_test and
# symmetric_purge_diagnostic -- are omitted here rather than pinned to their
# False defaults. Both are off unless explicitly set; add them on the command
# line for a one-off investigation. See CohortSplitter for what each isolates.
os_filter: both # both, ios, android
# none = one sample per survey response. The morning and afternoon surveys ask
# about different periods ("since your last prompt"), so collapsing them to a
# daily label mislabels one half of a discordant day: 41% of days with any
# positive have only one positive half. Options: mean, max, min, first, last, none
collapse_strategy: none

# Drop responses whose sampling window has no sensor records rather than feeding
# the model all-zero sequences it cannot distinguish from genuine inactivity
require_sensor_data: false

# Carry which daily survey a response is, and how long its referent period ran
use_survey_context: false
include_time_features: true
use_demographics: true
use_sleep: false


# Test accounts and discontinued participants, dropped from every stream.
# null uses CohortBuilder.DEFAULT_EXCLUDED_USER_IDS.
exclude_user_ids: null
