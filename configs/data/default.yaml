defaults:
  - _self_
  - aggregator: suicide_risk
  - sampler: rolling
  - scaler: robust
  - preprocessors: [step, calorie]

_target_: src.data.health_datamodule.HealthDataModule
modalities: ["step", "calorie"]

batch_size: 16
train_val_test_split: [0.7, 0.15, 0.15]
num_workers: 1
pin_memory: False
random_state: ${seed}
split_mode: user # random, user, longitudinal
os_filter: both # both, ios, android
collapse_strategy: max #mean, max, min, first, last, none — max preserves the worst (most elevated) state of the day for rare-positive risk detection
use_prev_prediction: false
use_demographics: true
use_sleep: true

