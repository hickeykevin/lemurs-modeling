defaults:
  - _self_
  - aggregator: suicide_risk
  - sampler: block
  - scaler: subject_standard
  - preprocessors: [step]

_target_: src.data.health_datamodule.HealthDataModule
modalities: ["step"]

batch_size: 16
train_val_test_split: [0.7, 0.15, 0.15]
num_workers: 1
pin_memory: False
random_state: ${seed}
split_mode: longitudinal # random, user, longitudinal
os_filter: both # both, ios, android
collapse_strategy: mean #mean, max, min, first, last, none

