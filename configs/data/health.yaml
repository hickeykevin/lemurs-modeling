defaults:
  - _self_
  - aggregator: mean
  - sampler: daily
  - scaler: none

_target_: src.data.health_datamodule.HealthDataModule
modalities: ["step", "calorie"]
question_ids: [2,3]

batch_size: 8
train_val_test_split: [0.7, 0.15, 0.15]
num_workers: 0
pin_memory: False
random_state: ${seed}
split_mode: longitudinal # random, user, longitudinal
