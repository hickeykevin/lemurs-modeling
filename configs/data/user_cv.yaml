defaults:
  - _self_
  - aggregator: suicide_risk
  - sampler: interval_aware
  - scaler: dual
  - preprocessors: [step, calorie]

_target_: src.data.cv_health_datamodule.CVHealthDataModule
modalities: ["step", "calorie"]

num_folds: 5 # grouped on app_user_id, stratified so every fold has positive test users
current_fold: 0

num_repeats: 10 # repeats the k-fold with different shuffles to report a spread across draws
current_repeat: 0

batch_size: 16
train_val_test_split: [0.7, 0.15, 0.15]
num_workers: 1
pin_memory: False
random_state: ${seed}
os_filter: both # both, ios, android

collapse_strategy: null # one sample per survey response; see configs/data/default.yaml
require_sensor_data: true
use_survey_context: true
include_time_features: true

use_demographics: true
use_sleep: true

exclude_user_ids: null
