defaults:
  - _self_
  - aggregator: suicide_risk
  - sampler: block
  - scaler: standard
  - preprocessors: [step]

_target_: src.data.cv_health_datamodule.CVHealthDataModule
modalities: ["step", "calorie"]

num_folds: 5
current_fold: 0

batch_size: 16
train_val_test_split: [0.7, 0.15, 0.15]
num_workers: 1
pin_memory: False
random_state: ${seed}
os_filter: ios # both, ios, android
collapse_strategy: mean

