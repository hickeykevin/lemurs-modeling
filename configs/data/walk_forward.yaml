defaults:
  - _self_
  - aggregator: suicide_risk
  - sampler: interval_aware
  - scaler: dual
  - preprocessors: [step, calorie]

_target_: src.data.walk_forward_health_datamodule.WalkForwardHealthDataModule
modalities: ["step", "calorie"]

# Per-user, purged, expanding-window walk-forward CV. Answers "given a
# user's own history, can the model forecast their near-future risk?" --
# see WalkForwardHealthDataModule and CohortSplitter.split_walk_forward.
#
# Values below are sized from this cohort's actual response-count
# distribution (44 users after exclusions, median ~45-51 responses/user,
# p5 ~9.4 among ever-positive users -- see the response-count exploration
# in the walk-forward-cv branch history). Re-derive these if the cohort
# changes materially (more enrolled users, a different survey cadence).
#
# burn_in_responses=16 (raised from an initial 8) trades a small amount of
# user coverage for a substantially larger per-fold training set: at
# burn_in=8, fold 0 trains on 43 pooled rows across 27/31 covered users;
# at burn_in=16, fold 0 trains on 236 pooled rows across 25/31 users --
# roughly 5.5x more train data for 2 fewer users of coverage. Every later
# fold's train set is `burn_in + fold_index * step_responses` pooled rows,
# so this floor lifts every fold, not just fold 0. See
# WalkForwardHealthDataModule's docstring for why raising burn_in and
# raising step_responses both grow train size at the cost of fold count /
# coverage -- there's no lever that grows train size for free.
#
# val_responses=0: no validation window at all (every fold is just
# train | purge | test) -- see WalkForwardHealthDataModule's docstring.
# Every fold trains for its full configured epoch budget and is tested
# with the final-epoch weights, since there is no val/* metric for
# EarlyStopping/ModelCheckpoint to monitor.
burn_in_responses: 16
step_responses: 8
val_responses: 0
current_fold: 0

batch_size: 16
num_workers: 1
pin_memory: False
random_state: ${seed}
os_filter: both # both, ios, android

collapse_strategy: none
require_sensor_data: true
use_survey_context: true
include_time_features: true

use_demographics: true
use_sleep: true

# Purge gap (hours) at every fold's train/val and val/test boundary. null
# derives it from the sampler's own lookback window, same as
# split_mode="longitudinal" in configs/data/default.yaml.
purge_hours: null

exclude_user_ids: null
