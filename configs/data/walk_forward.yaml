defaults:
  - _self_
  - aggregator: suicide_risk
  - sampler: interval_aware
  - scaler: dual
  - preprocessors: [step, calorie]

_target_: src.data.walk_forward_health_datamodule.WalkForwardHealthDataModule
modalities: ["step", "calorie"]

# Per-user, purged, expanding-window walk-forward CV. Answers "given a
# user's own history, can the model forecast their near-future risk?" --
# see WalkForwardHealthDataModule and CohortSplitter.split_walk_forward.
#
# fold_sizing="pct": each fold's train/test cut is a FRACTION of each
# user's own total response count, rather than a fixed absolute count
# (fold_sizing="count", the earlier approach -- burn_in_responses/
# step_responses/val_responses below are its params, unused while
# fold_sizing="pct"). The count-based version's test window is a fixed
# size for every user, so users with less remaining history stop
# contributing to later folds one by one, and the last fold or two end up
# thin (in this cohort: as few as 1 user / 8 predictions / 0 positives).
# Percentage-based sizing fixes this: every eligible user contributes to
# every fold, since test size scales with their own total. Against this
# cohort, burn_in_pct=0.4/step_pct=0.15 gives 4 folds with a near-flat
# ~28 users each (28,28,28,28) and 733 pooled test predictions, vs. the
# count-based version's 25->21->19->14->4->1 user decay across 6 folds.
# See CohortSplitter.split_walk_forward_pct and
# WalkForwardHealthDataModule's docstring for the full mechanics.
fold_sizing: pct
burn_in_pct: 0.4
step_pct: 0.15
val_pct: 0.0
current_fold: 0

# Unused while fold_sizing="pct" above; kept so switching back to
# fold_sizing="count" (see CohortSplitter.split_walk_forward) doesn't
# require re-adding these. Sized from this cohort's actual response-count
# distribution (44 users after exclusions, median ~45-51 responses/user,
# p5 ~9.4 among ever-positive users) when they were last used directly.
burn_in_responses: 16
step_responses: 8
val_responses: 0

batch_size: 16
num_workers: 1
pin_memory: False
random_state: ${seed}
os_filter: both # both, ios, android

collapse_strategy: none
require_sensor_data: true
use_survey_context: true
include_time_features: true

use_demographics: true
use_sleep: true

# Purge gap (hours) at every fold's train/val and val/test boundary. null
# derives it from the sampler's own lookback window, same as
# split_mode="longitudinal" in configs/data/default.yaml.
purge_hours: null

exclude_user_ids: null
