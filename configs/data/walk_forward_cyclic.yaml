defaults:
  - _self_
  - aggregator: suicide_risk
  - sampler: sweep_configs/rolling_72h_6h # lookback x bin: one of the 20 rolling_* configs
  - scaler: dual
  - modalities: step_distance

_target_: src.data.walk_forward_health_datamodule.WalkForwardHealthDataModule

# fold_sizing=cyclic: fixed-width train window that SLIDES and WRAPS past
# 100% back to 0%. train_width_pct + step_pct == 1.0 makes train the exact
# complement of test each fold. See eval_schemes.md and
# CohortSplitter.split_walk_forward_cyclic (both wrap boundaries are purged).
fold_sizing: cyclic
train_width_pct: 0.80
step_pct: 0.20 # -> 5 folds, each 20% of a user's data as test
current_fold: 0

batch_size: 16
num_workers: 1
pin_memory: False
random_state: ${seed}
os_filter: both # both, ios, android

collapse_strategy: none
require_sensor_data: true # only surveys whose window has sensor data
use_survey_context: false
survey_context_mode: none
include_time_features: false

use_demographics: false
use_age: false
use_gender: false
use_lgbt: false
use_device_source: false
use_sleep: true # hours slept is the only non-sensor feature
sleep_feature_mode: hours_only

purge_hours: 120.0 # gap (hours) purged at each fold boundary: the longest lookback, for every sampler

exclude_user_ids: null # null uses CohortBuilder.DEFAULT_EXCLUDED_USER_IDS

# Database rows the paper's runs read (see src/utils/row_manifest.py and results/README.md).
# null reads the current database instead.
row_manifest: ${paths.root_dir}/results/row_manifest_2026-10-07.json

# Hyperparameters carried from W&B sweep umdhgse9 (1291 runs, split_mode=
# longitudinal), specifically its #1 leaderboard run (6yssfkcp, mean val
# AUROC 0.9700), to test whether that combination holds up under per-user
# walk-forward pooled evaluation. Shared with single_split.yaml and
# walk_forward_expanding.yaml so the three schemes compare without a
# hyperparameter confound. Full sweep rationale (per-flag significance,
# what was and wasn't carried): see git history for this file.
