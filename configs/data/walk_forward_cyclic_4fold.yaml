defaults:
  - _self_
  - aggregator: suicide_risk
  - sampler: interval_aware
  - scaler: dual
  - preprocessors: [step, calorie]

_target_: src.data.walk_forward_health_datamodule.WalkForwardHealthDataModule
modalities: ["step", "calorie"]

# Cyclic walk-forward CV, sized so train is the COMPLEMENT of test each
# fold: train_width_pct + step_pct == 1.0, so every fold's train is "all of
# this user's data except this fold's test window," wrapping around --
# ordinary 4-fold cross-validation, except each fold's train window is a
# contiguous (wrapped) chronological block rather than a random subset, and
# the fixed train/test boundary is still purged to prevent a sampler's
# lookback window from crossing it. See configs/data/walk_forward_cyclic.yaml
# and CohortSplitter.split_walk_forward_cyclic for the shared mechanics; this
# config only differs in its train_width_pct/step_pct values.
#
# train_width_pct=0.75, step_pct=0.25 -> ceil(1/0.25) = 4 folds, each 25% of
# a user's data as test and the remaining 75% (wrapped) as train.
fold_sizing: cyclic
train_width_pct: 0.75
step_pct: 0.25
current_fold: 0

batch_size: 16
num_workers: 1
pin_memory: False
random_state: ${seed}
os_filter: both # both, ios, android

collapse_strategy: none
require_sensor_data: true
use_survey_context: true
include_time_features: true

use_demographics: true
use_sleep: true

# Purge gap (hours) at every fold's train/test boundary. null derives it
# from the sampler's own lookback window, same as split_mode="longitudinal"
# in configs/data/default.yaml.
purge_hours: null

exclude_user_ids: null
