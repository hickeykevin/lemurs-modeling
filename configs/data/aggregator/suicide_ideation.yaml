#suicide ideation questions:
#(2) 5-scale (1-5): I wanted to die
#(3) 5-scale (1-5): I thought about taking my life
#(5) 5-scale (1-5): Considered a specific suicide method or made preparations for your death
#    NOTE: this file's comment previously called (5) yes-no. Checked directly
#    against the DB's question table -- its style is "5-scale-much", same as
#    (2)/(3), not yes-no. As yes-no with "any_gt val: 0", every response's
#    minimum possible answer (1) trips ">0", so the rule was true for
#    virtually every response (1983/1983 in a direct check), saturating the
#    whole aggregator. Moved into rule_1 alongside 2/3 below.

#labeling strategy:
# - Any ideation item (questions 2,3,5) ≥ 1

_target_: src.data.components.label_aggregators.RuleBasedAggregator
combination_logic: "any"
rules:
  rule_1:
    ids: [2, 3, 5]
    op: "ge"
    val: 1.0

