defaults:
  - _self_
  - aggregator: suicide_risk
  - sampler: offset_48h_6h
  - scaler: dual
  - preprocessors: [step, distance]

_target_: src.data.indexed_health_datamodule.IndexedHealthDataModule
modalities: ["step", "distance"]

# split_mode="longitudinal": ONE train/val/test cut per user, by
# chronological position (see CohortSplitter._split_longitudinally) -- the
# single-cut baseline being compared against walk_forward_pct_sweep.yaml
# (expanding-window, multiple folds) and
# walk_forward_cyclic_5fold_sweep.yaml (cyclic, fixed-width, wraparound).
# Same data/model settings as those two, carried from sweep umdhgse9 (see
# walk_forward_cyclic_5fold_sweep.yaml's comment), so the three evaluation
# schemes are compared holding hparams fixed.
#
# _target_ is IndexedHealthDataModule rather than plain HealthDataModule so
# data_val/data_test are built with return_index=True (see
# IndexedHealthDataModule), letting PredictionCollectorCallback collect this
# run's test predictions and a pooled, user-cluster BCa bootstrap CI be
# computed for them -- the same treatment the two walk-forward configs
# above get, rather than ClassificationMetricsCallback's row-level
# BootStrapper CI (which understates uncertainty here for the same reason a
# row-level bootstrap is wrong everywhere else in this pipeline -- see
# CohortSplitter's class docstring).
split_mode: longitudinal
train_val_test_split: [0.7, 0.15, 0.15]
purge_hours: null
swap_val_test: false
symmetric_purge_diagnostic: false

batch_size: 16
num_workers: 1
pin_memory: False
random_state: ${seed}
os_filter: both

collapse_strategy: none
require_sensor_data: true
use_survey_context: true
include_time_features: false

use_demographics: true
use_sleep: true

exclude_user_ids: null
