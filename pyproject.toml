[project]
name = "lemurs-modeling"
version = "0.1.0"
description = "LEMURS modeling package"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0.0",
    "lightning>=2.0.0",
    "torchmetrics>=0.11.4",
    "hydra-core==1.3.2",
    "hydra-colorlog==1.2.0",
    "wandb",
    "rootutils",
    "rich",
    "pytest",
    "pandas",
    "psycopg2-binary>=2.9.11",
    "sshtunnel>=0.4.0",
    "scikit-learn>=1.8.0",
    "flaml[automl]>=2.5.0",
    "pycatch22",
]

[project.optional-dependencies]
# Foundation models (one extra each): `uv sync --extra tabpfn --extra tirex --extra chronos`.
# model=flaml_tabpfn / flaml_tabpfn_ft: Prior Labs' TabPFN-3.5. Weights: non-commercial
# licence (Prior-Labs/tabpfn_3_5 on Hugging Face).
tabpfn = [
    "tabpfn==9.1.0",
]
# model=tirex / tirex_ft: NX-AI's TiRex (xLSTM). Runs on CPU; the `tirex-ts[cuda]` kernels
# are not required.
tirex = [
    "huggingface_hub>=0.24.0",
    "tirex-ts==1.4.2",
]
# model=chronos_bolt / chronos_bolt_ft: Amazon's Chronos-Bolt (mini).
chronos = [
    "huggingface_hub>=0.24.0",
    "chronos-forecasting==2.3.0",
]


[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = "True"
markers = [
  "slow: slow tests",
]
minversion = "6.0"
testpaths = "tests/"

[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
